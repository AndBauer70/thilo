<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2d3283">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Raketenturm</title>
<style>
  :root { --ink:#1d1d2b; --soft:#5a6178; --line:#d5d8e2; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#2d3283; overflow:hidden;
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", Nunito, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  button { font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  button:disabled { cursor:default; }
  #game { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; display:block; }

  /* Menüknopf (gedrückt halten) */
  #menuBtn { position:fixed; top:calc(env(safe-area-inset-top) + 10px); right:12px; z-index:12; display:none;
    width:52px; height:52px; border-radius:50%; border:none; background:rgba(255,255,255,.35); color:#fff; place-items:center; }
  #menuBtn svg.ic { width:24px; height:24px; position:relative; z-index:1; }
  #menuBtn svg.ring { position:absolute; inset:0; width:52px; height:52px; transform:rotate(-90deg); }
  #menuBtn svg.ring circle { fill:none; stroke:#fff; stroke-width:4; stroke-dasharray:151; stroke-dashoffset:151; }
  #menuBtn.hold svg.ring circle { transition:stroke-dashoffset 1s linear; stroke-dashoffset:0; }

  /* Zielkarte */
  #card { position:fixed; top:calc(env(safe-area-inset-top) + 72px); left:50%; transform:translateX(-50%); z-index:4;
    background:#fff; border-radius:22px; padding:8px; display:none; cursor:pointer; border:3px solid #c9c3f0; box-shadow:0 4px 18px rgba(20,20,80,.35); }
  #card svg.sv { width:86px; height:86px; display:block; }
  #card.attn { animation:cardAttn .45s ease-in-out 4; }
  @keyframes cardAttn { 50% { scale:1.18; } }
  #card .badge { position:absolute; right:-10px; top:-10px; width:34px; height:34px; border-radius:50%; background:#2d3283; color:#fff; display:grid; place-items:center; }
  #card .badge svg { width:20px; height:20px; }

  /* Steuerpult */
  #bottom { position:fixed; left:0; right:0; bottom:0; z-index:4; display:none; flex-direction:column; align-items:center; gap:10px;
    padding:0 10px calc(env(safe-area-inset-bottom) + 12px); pointer-events:none; }
  #bottom > * { pointer-events:auto; }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .big { font-size:18px; font-weight:800; border:none; border-radius:22px; padding:14px 20px; min-height:56px;
    background:#fff; color:#2d3283; box-shadow:0 5px 0 #b9b6e6, 0 8px 18px rgba(20,20,80,.3); }
  .big.dark { background:#1d1d2b; color:#fff; }
  .rbtn { width:56px; height:56px; border-radius:50%; border:none; background:rgba(255,255,255,.94); color:var(--ink);
    display:grid; place-items:center; box-shadow:0 2px 10px rgba(0,0,0,.35); }
  .rbtn svg { width:28px; height:28px; }
  #panel { position:relative; display:flex; gap:10px; justify-content:center; background:rgba(45,50,131,.88); border:3px solid rgba(255,255,255,.4);
    border-radius:26px; padding:20px 12px 12px; box-shadow:0 6px 24px rgba(0,0,0,.45); }
  #panel .ptype { position:absolute; top:-20px; left:50%; transform:translateX(-50%); width:40px; height:40px; border-radius:50%;
    background:#fff; color:var(--ink); display:grid; place-items:center; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  #panel .ptype svg { width:24px; height:24px; }
  .opt { width:min(20vw, 92px, 19vh); height:min(20vw, 92px, 19vh); border:none; background:#fff; border-radius:20px; padding:7px;
    display:grid; place-items:center; box-shadow:0 5px 0 #b9b6e6, 0 7px 14px rgba(20,20,80,.35); transition:transform .08s, opacity .2s; }
  .opt:active { transform:translateY(4px); box-shadow:0 1px 0 #b9b6e6, 0 3px 8px rgba(20,20,80,.35); }
  .opt svg { width:100%; height:100%; display:block; }
  .p-blocker .opt { border-radius:50%; }
  .p-lift .opt { border-radius:50%; box-shadow:0 0 0 5px #d4eef5 inset, 0 5px 0 #b9b6e6, 0 7px 14px rgba(20,20,80,.35); padding:12px; }
  .p-door .opt { border-radius:12px; }
  .opt.pulse { animation:optPulse .9s ease-in-out infinite; box-shadow:0 0 0 6px rgba(255,255,255,.9), 0 0 26px 8px rgba(255,255,255,.7); }
  .opt.dim { opacity:.22; }
  .opt.shake { animation:shake .45s; }
  @keyframes optPulse { 0%,100% { transform:scale(1);} 50% { transform:scale(1.1);} }
  @keyframes shake { 0%,100% { transform:translateX(0);} 20% { transform:translateX(-9px);} 40% { transform:translateX(9px);} 60% { transform:translateX(-6px);} 80% { transform:translateX(6px);} }
  @media (orientation:landscape) and (max-height:520px) { #card { left:16px; transform:none; } }

  /* Bildschirme */
  .screen { position:fixed; inset:0; z-index:10; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:24px; color:#fff; text-align:center; background:rgba(45,50,131,.42); }
  .screen h1 { margin:0; font-size:46px; letter-spacing:.5px; text-shadow:0 4px 0 #6f6ab3, 0 8px 18px rgba(20,20,80,.35); }
  .screen p { margin:0; font-size:17px; opacity:.95; max-width:420px; line-height:1.4; text-shadow:0 1px 6px rgba(20,20,80,.7); }
  .screen .big { min-width:250px; }
  .go { font-size:26px !important; padding:22px 34px !important; border-radius:24px !important; }
  .link { background:none; border:none; color:#fff; text-decoration:underline; font-size:16px; opacity:.85; padding:8px; }
  .small { font-size:13px !important; opacity:.7 !important; }
  #toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 150px); transform:translateX(-50%); z-index:30;
    background:#fff; color:var(--ink); padding:10px 16px; border-radius:14px; font-size:15px; box-shadow:0 4px 18px rgba(0,0,0,.4);
    opacity:0; transition:opacity .25s; pointer-events:none; max-width:90vw; text-align:center; }
  #toast.show { opacity:1; }
  #win { background:rgba(45,50,131,.22); }
  #win .stickers { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:340px; }
  #win .stickers svg { width:34px; height:34px; }

  /* Einstellungen */
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:20; max-height:84vh; max-height:84dvh; overflow:auto; background:#fff; color:var(--ink);
    border-radius:22px 22px 0 0; transform:translateY(105%); transition:transform .25s; padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);
    box-shadow:0 -6px 24px rgba(0,0,0,.35); }
  #sheet.open { transform:none; }
  #sheet h2 { margin:4px 0 10px; font-size:20px; display:flex; justify-content:space-between; align-items:center; }
  #sheet h3 { margin:16px 0 8px; font-size:15px; color:var(--soft); font-weight:700; }
  .seg { display:flex; flex-wrap:wrap; gap:6px; }
  .seg button { flex:1 1 auto; min-height:46px; border-radius:12px; border:2px solid var(--line); background:#f6f7fb; font-size:15px; font-weight:600; color:var(--ink); padding:6px 10px; }
  .seg button.on { border-color:var(--ink); background:var(--ink); color:#fff; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:flex; align-items:center; gap:6px; border:2px solid var(--line); background:#fff; border-radius:999px; padding:5px 11px 5px 6px; font-size:14px; min-height:42px; color:var(--ink); }
  .chip.on { border-color:var(--ink); background:#eef0f7; }
  .chip:not(.on) { opacity:.45; }
  .chip .cd { width:26px; height:26px; border-radius:50%; border:2px solid var(--ink); }
  .chip svg { width:28px; height:28px; }
  .tog { display:flex; align-items:center; gap:10px; font-size:16px; padding:8px 0; }
  .tog input { width:24px; height:24px; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .actions button { min-height:52px; border-radius:14px; border:2px solid var(--ink); background:#fff; font-size:16px; font-weight:700; color:var(--ink); }
  .actions button.dark { background:var(--ink); color:#fff; }
  table.log { width:100%; border-collapse:collapse; font-size:14px; }
  table.log td { padding:4px 2px; border-bottom:1px solid #eceef4; }
  table.log td:last-child { text-align:right; white-space:nowrap; }
  .hint { font-size:13px; color:var(--soft); margin:6px 0 0; line-height:1.35; }

  /* Online: Kopfleiste, Raum, Countdown, Ergebnis */
  #hud { position:fixed; left:0; top:0; z-index:12; display:none; align-items:center; gap:8px; padding:calc(env(safe-area-inset-top) + 10px) 12px 0; max-width:calc(100vw - 76px); }
  .rbtn.sm { width:44px; height:44px; flex:none; } .rbtn.sm svg { width:22px; height:22px; }
  .rbtn.off { background:rgba(255,255,255,.45); }
  .pill { background:rgba(10,14,40,.6); color:#fff; border-radius:999px; padding:8px 14px; font-size:14px;
    display:flex; gap:8px; align-items:center; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pill span:last-child { overflow:hidden; text-overflow:ellipsis; }
  .sdot { width:11px; height:11px; border-radius:50%; background:#9aa3b5; flex:none; }
  .sdot.ok { background:#7be08a; } .sdot.wait { background:#ffc65c; } .sdot.bad { background:#ff7b7b; }
  #soundFix { display:none; }
  .who { display:flex; gap:14px; justify-content:center; }
  .who button { display:flex; flex-direction:column; align-items:center; gap:4px; width:146px; min-width:0 !important; padding:12px 8px 14px; font-size:20px; }
  .who img { width:96px; height:96px; }
  #count { position:fixed; inset:0; z-index:9; display:none; place-items:center; pointer-events:none; }
  #count span { font-size:min(36vw, 200px); font-weight:900; color:#fff; text-shadow:0 8px 0 #6f6ab3, 0 14px 30px rgba(20,20,80,.5); animation:cdPop .8s ease-out; }
  @keyframes cdPop { 0% { transform:scale(.3); opacity:0; } 30% { transform:scale(1.12); opacity:1; } 100% { transform:scale(1); opacity:1; } }
  .score { display:none; gap:14px; justify-content:center; align-items:stretch; }
  .score .pl { display:flex; flex-direction:column; align-items:center; gap:2px; background:rgba(255,255,255,.16); border-radius:20px; padding:10px 12px; min-width:132px; }
  .score .pl.win { background:rgba(255,255,255,.32); box-shadow:0 0 0 3px #fff; }
  .score img { width:72px; height:72px; }
  .score .nm { font-weight:800; font-size:18px; }
  .score .cups { display:flex; flex-wrap:wrap; gap:2px; justify-content:center; max-width:150px; min-height:30px; align-items:center; font-weight:800; }
  .score .cups svg { width:26px; height:26px; }
  #wait img, #lobby img { width:130px; height:130px; animation:bob 1.6s ease-in-out infinite; }
  #lobby img.away, #wait img.away { opacity:.35; filter:grayscale(1); animation:none; }
  @keyframes bob { 50% { transform:translateY(-10px); } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<button id="menuBtn" aria-label="Einstellungen (gedrückt halten)"></button>
<div id="hud">
  <button class="rbtn sm" id="micBtn" aria-label="Mikrofon an oder aus"></button>
  <div class="pill" id="status"><span class="sdot" id="sdot"></span><span id="stxt">…</span></div>
  <button class="rbtn sm" id="soundFix" aria-label="Ton einschalten"></button>
</div>
<div id="count"></div>
<div id="card"></div>
<div id="bottom"></div>

<div class="screen" id="start">
  <h1>Raketenturm</h1>
  <p id="startTxt"></p>
  <div id="startBtns" style="display:flex;flex-direction:column;gap:12px;align-items:center"></div>
  <p class="small">Einstellungen im Spiel: Menüknopf oben rechts gedrückt halten.</p>
</div>

<div class="screen" id="lobby">
  <img id="lobbyFig" alt="">
  <h1 id="lobbyH">Warte auf Thilo</h1>
  <p id="lobbyTxt"></p>
  <button class="big go" id="raceBtn" disabled>Rennen starten</button>
  <button class="link" id="lobbySettings">Einstellungen</button>
</div>

<div class="screen" id="wait">
  <img id="waitFig" alt="">
  <h1 id="waitH">Gleich geht's los!</h1>
  <p id="waitTxt"></p>
  <button class="link" id="waitSettings">Einstellungen</button>
</div>

<div class="screen" id="pause">
  <svg width="110" height="110" viewBox="0 0 100 100" aria-hidden="true"><path d="M62 12a40 40 0 1 0 26 58A32 32 0 0 1 62 12z" fill="#f4f1e6" stroke="#fff" stroke-width="3"/><circle cx="42" cy="55" r="5" fill="#dcd6c3"/><circle cx="55" cy="72" r="3.5" fill="#dcd6c3"/></svg>
  <h1>Pause</h1>
  <button class="big" id="resumeBtn">Weiter</button>
</div>

<div class="screen" id="win">
  <h1 id="winH">Geschafft!</h1>
  <p id="winTxt"></p>
  <div class="stickers" id="stickers"></div>
  <div class="score" id="score"></div>
  <button class="big go" id="againBtn">Noch ein Turm</button>
  <p id="winWait"></p>
</div>
<audio id="remote" autoplay playsinline></audio>

<div id="sheet" role="dialog" aria-label="Einstellungen"></div>
<div id="toast"></div>

<script async src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"
        onerror="var s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js';document.head.appendChild(s)"></script>
<script>
'use strict';
/* ==========================================================
   Raketenturm – Farben und Formen lernen, als Wettrennen
   Thilo und Opi klettern auf zwei Handys um die Wette
   (Online-Verbindung und Sprachchat per WebRTC/PeerJS).
   Turm im Stil von Nebulus: Wege und Treppen außen herum,
   Farbmonster, Türen mit Farbschloss und Aufzüge.
   „Allein üben“ läuft auch ohne Internet.
   ========================================================== */

// ---------- Hier lässt sich das Spiel anpassen ----------
const CFG = {
  kind: 'Thilo',            // Name des Kindes
  begleiter: 'Opi',         // Name des Gegners im Rennen
  peerPrefix: 'raketenturm-rennen-',
  raum: 'akr1jpd9beo2th',   // fester Raum für Thilos und Opis Handy – für eine andere Familie hier einen anderen Namen eintragen
  iceServers: null,         // optional eigene STUN/TURN-Server, z. B. [{ urls: 'stun:stun.l.google.com:19302' }]
};

const COLORS = [
  { id:'rot',     name:'Rot',     hex:'#E53935', adj:'rote',     akkM:'roten' },
  { id:'gelb',    name:'Gelb',    hex:'#FDD835', adj:'gelbe',    akkM:'gelben' },
  { id:'blau',    name:'Blau',    hex:'#1E88E5', adj:'blaue',    akkM:'blauen' },
  { id:'gruen',   name:'Grün',    hex:'#43A047', adj:'grüne',    akkM:'grünen' },
  { id:'orange',  name:'Orange',  hex:'#FB8C00', adj:'orange',   akkM:'orangen' },
  { id:'lila',    name:'Lila',    hex:'#8E24AA', adj:'lila',     akkM:'lila' },
  { id:'rosa',    name:'Rosa',    hex:'#F48FB1', adj:'rosa',     akkM:'rosa' },
  { id:'braun',   name:'Braun',   hex:'#795548', adj:'braune',   akkM:'braunen' },
  { id:'schwarz', name:'Schwarz', hex:'#222222', adj:'schwarze', akkM:'schwarzen' },
  { id:'weiss',   name:'Weiß',    hex:'#FAFAFA', adj:'weiße',    akkM:'weißen' },
];
const NEUTRAL = { id:'neutral', name:'', hex:'#ECEEF3', adj:'', akkM:'' };
const SHAPES = [
  { id:'kreis',    name:'Kreis',    g:'m' },
  { id:'quadrat',  name:'Quadrat',  g:'n' },
  { id:'dreieck',  name:'Dreieck',  g:'n' },
  { id:'rechteck', name:'Rechteck', g:'n' },
  { id:'stern',    name:'Stern',    g:'m' },
  { id:'herz',     name:'Herz',     g:'n' },
];
const COL = Object.fromEntries([...COLORS, NEUTRAL].map(c => [c.id, c]));
const SHP = Object.fromEntries(SHAPES.map(s => [s.id, s]));

const CONTENTS = [['farben','Farben'], ['formen','Formen'], ['formenbunt','Formen bunt'], ['kombi','Farbe + Form']];
const STATIONS = [['blocker','Farbmonster'], ['door','Türen'], ['lift','Aufzüge']];
const DEFAULTS = { content:'farben', count:3, height:8, colors:COLORS.map(c => c.id), shapes:SHAPES.map(s => s.id),
                   stations:['blocker','door','lift'], calm:false, opiSpeed:.75 };
const OPI_DEFAULTS = { content:'kombi', count:4 };   // Opi bekommt schwerere Aufgaben, damit das Rennen fair bleibt

// ---------- Hilfsfunktionen ----------
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const smooth = t => t * t * (3 - 2 * t);
const now = () => performance.now();
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(Math.round(((n >> 16) & 255) * f), 0, 255), g = clamp(Math.round(((n >> 8) & 255) * f), 0, 255), b = clamp(Math.round((n & 255) * f), 0, 255);
  return `rgb(${r},${g},${b})`;
}
let toastT = 0;
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }

// ---------- Sätze ----------
function np(it, content, cas) { // cas: nom | akk | dat
  const c = COL[it.color], s = SHP[it.shape];
  if (content === 'farben') return c.name;
  const art = cas === 'dat' ? 'dem' : s.g === 'm' ? (cas === 'akk' ? 'den' : 'der') : 'das';
  if (content === 'kombi') { const adj = (cas === 'dat' || (s.g === 'm' && cas === 'akk')) ? c.akkM : c.adj; return `${art} ${adj} ${s.name}`; }
  return `${art} ${s.name}`;
}
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const TXT = { label: (it, c) => cap(np(it, c, 'nom')) };   // nur für das Lernprotokoll

// ---------- Formen als SVG ----------
function svgPath(shape, s) {
  const x = 50, y = 50, h = s / 2;
  switch (shape) {
    case 'kreis':    return `M${x - h},${y} a${h},${h} 0 1,0 ${s},0 a${h},${h} 0 1,0 ${-s},0 Z`;
    case 'quadrat':  { const q = s * .43; return `M${x - q},${y - q} H${x + q} V${y + q} H${x - q} Z`; }
    case 'rechteck': { const w = s * .52, hh = s * .29; return `M${x - w},${y - hh} H${x + w} V${y + hh} H${x - w} Z`; }
    case 'dreieck':  return `M${x},${y - s * .5} L${x + s * .55},${y + s * .42} L${x - s * .55},${y + s * .42} Z`;
    case 'stern': { let d = ''; for (let i = 0; i < 10; i++) { const r = i % 2 ? s * .24 : s * .55, a = -Math.PI / 2 + i * Math.PI / 5; d += (i ? 'L' : 'M') + (x + r * Math.cos(a)).toFixed(1) + ',' + (y + r * Math.sin(a)).toFixed(1); } return d + 'Z'; }
    case 'herz': return `M${x},${y + s * .45} C${x - s * .6},${y + s * .05} ${x - s * .55},${y - s * .5} ${x},${y - s * .22} C${x + s * .55},${y - s * .5} ${x + s * .6},${y + s * .05} ${x},${y + s * .45} Z`;
  }
  return '';
}
function svgShape(shape, color, cls = '') {
  const d = svgPath(shape, 66);
  return `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><path d="${d}" fill="none" stroke="#fff" stroke-width="12" stroke-linejoin="round"/><path d="${d}" fill="${COL[color].hex}" stroke="#1d1d2b" stroke-width="4.5" stroke-linejoin="round"/></svg>`;
}
const ICON = {
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  micOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"/></svg>',

  cup: '<svg viewBox="0 0 40 40"><path d="M12 6h16v8a8 8 0 0 1-16 0z" fill="#ffd54f" stroke="#1d1d2b" stroke-width="2" stroke-linejoin="round"/><path d="M12 9H7a5 5 0 0 0 6 8M28 9h5a5 5 0 0 1-6 8" fill="none" stroke="#1d1d2b" stroke-width="2"/><path d="M18 22h4v6h-4z" fill="#ffd54f" stroke="#1d1d2b" stroke-width="2"/><path d="M13 33h14v-3a2 2 0 0 0-2-2H15a2 2 0 0 0-2 2z" fill="#f2b84b" stroke="#1d1d2b" stroke-width="2"/></svg>',

    $('#waitH').textContent = connected ? `${CFG.begleiter} ist da!` : `Warte auf ${CFG.begleiter}`;
    $('#waitTxt').textContent = connected ? `${CFG.begleiter} startet gleich das Rennen.` : `Sobald ${CFG.begleiter} das Spiel öffnet, geht's los.`;
  }
  const task = !!(inGame && S.level && S.phase === 'task' && S.st >= 0 && !S.paused);
  const st = task ? curSt() : null;
  const card = $('#card');
  if (task) {
    const key = st.type + st.item.color + st.item.shape;
    if (card.dataset.k !== key) { card.innerHTML = svgShape(st.item.shape, st.item.color, 'sv') + `<span class="badge">${ICON[st.type]}</span>`; card.dataset.k = key; }
    card.style.display = 'block';
  } else { card.style.display = 'none'; card.dataset.k = ''; }
  const bot = $('#bottom'); let html = '';
  if (task) {
    html = `<div id="panel" class="p-${st.type}"><span class="ptype">${ICON[st.type]}</span>${S.items.map((it, i) => {
        const pulse = S.help >= 2 && i === S.target, dim = S.help >= 3 && i !== S.target;
        return `<button class="opt ${pulse ? 'pulse' : ''} ${dim ? 'dim' : ''}" data-i="${i}" ${dim ? 'disabled' : ''} aria-label="Auswahl ${i + 1}">${svgShape(it.shape, it.color)}</button>`; }).join('')}</div>`;
  }
  if (bot.dataset.h !== html) { bot.innerHTML = html; bot.dataset.h = html; }
  bot.style.display = html ? 'flex' : 'none';
  show('#pause', !!(inGame && S.paused));
  const winOn = !!(inGame && S.phase === 'win' && V.win && V.win.overlay);
  show('#win', winOn);
  if (winOn) fillWin();
  if ($('#sheet').classList.contains('open')) buildSheet();
}
function fillWin() {
  const ag = $('#againBtn'), sc = $('#score');
  if (!R) {   // allein üben
    $('#winH').textContent = 'Geschafft!'; $('#winTxt').textContent = ''; $('#winWait').textContent = '';
    $('#stickers').style.display = 'flex'; $('#stickers').innerHTML = ICON.rocket.repeat(Math.min(S.towers, 30));
    sc.style.display = 'none'; ag.style.display = ''; ag.disabled = false; ag.textContent = 'Noch ein Turm';
    return;
  }
  const me = role, opp = role === 'opi' ? 'thilo' : 'opi';
  $('#stickers').style.display = 'none';
  $('#winH').textContent = R.winner === me ? 'Erster!' : 'Geschafft!';
  $('#winTxt').textContent = R.winner === me ? `${nameOf(me)} war zuerst oben!` : R.winner === opp ? `${nameOf(opp)} war diesmal schneller.` : '';
  const pl = who => { const n = TALLY[who] || 0;
    return `<div class="pl ${R.winner === who ? 'win' : ''}"><img src="${figURL(who === 'opi' ? 'opi' : '')}" alt=""><div class="nm">${nameOf(who)}</div><div class="cups">${n > 6 ? ICON.cup + ' ' + n : ICON.cup.repeat(n)}</div></div>`; };
  const html = pl('thilo') + pl('opi');
  if (sc.dataset.h !== html) { sc.innerHTML = html; sc.dataset.h = html; }
  sc.style.display = 'flex';
  let wait = '';
  if (!R.done[opp]) wait = `${nameOf(opp)} klettert noch … (${R.oppK} von ${R.types.length} Stationen)`;
  if (!connected) wait = 'Verbindung weg – versuche erneut …';
  if (role === 'opi') { ag.style.display = ''; ag.textContent = 'Noch ein Rennen'; ag.disabled = !connected || !R.done.thilo; }
  else { ag.style.display = 'none'; if (R.done.opi && connected) wait = `${CFG.begleiter} startet gleich das nächste Rennen.`; }
  $('#winWait').textContent = wait;
}
$('#bottom').addEventListener('click', e => {
  const b = e.target.closest('.opt'); if (!b || b.disabled) return;
  audioCtx(); tap(+b.dataset.i);
});
function logTable() {
  const L = S ? S.log : {}, keys = Object.keys(L);
  if (!keys.length) return '<p class="hint">Noch nichts gespielt.</p>';
  keys.sort((a, b) => (L[a].first / L[a].total) - (L[b].first / L[b].total));
  return '<p class="hint">Beim ersten Versuch richtig (seit dem Öffnen der Seite):</p><table class="log">' + keys.map(k => `<tr><td>${k}</td><td>${L[k].first} von ${L[k].total}</td></tr>`).join('') + '</table>';
}

// ---------- Einstellungen ----------
function buildSheet() {
  const st = settings;
  const seg = (key, opts) => `<div class="seg">${opts.map(([v, l]) => `<button data-k="${key}" data-v="${v}" class="${String(st[key]) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  const inGame = S && S.level && S.phase !== 'idle' && !startOpen();
  $('#sheet').innerHTML = `
    <h2>Einstellungen <button class="big dark" id="sheetClose" style="min-height:44px;padding:8px 16px;font-size:16px">Fertig</button></h2>
    ${inGame || online() ? `<div class="actions">
      ${inGame && S.phase === 'task' ? '<button id="shHelp">Hilfe zeigen</button>' : ''}${inGame && S.phase !== 'win' ? `<button id="shPause">${S.paused ? 'Weiter' : 'Pause'}</button>` : ''}
      ${role === 'thilo' ? '' : `<button id="shNew" class="dark">${role === 'opi' ? 'Neues Rennen' : 'Neuer Turm'}</button>`}<button id="shStart">Zum Start</button>
    </div>` : ''}
    <p class="hint">${role === 'opi' ? `Das sind die Einstellungen für <b>${CFG.begleiter}s</b> Handy. Damit das Rennen fair bleibt, bekommt ${CFG.begleiter} schwerere Aufgaben als ${CFG.kind} (z. B. Farbe + Form mit 4 Knöpfen) und eine langsamere Figur. ${CFG.kind}s Aufgaben stellt man auf ${CFG.kind}s Handy ein.`
      : role === 'thilo' ? `Das sind die Einstellungen für <b>${CFG.kind}s</b> Handy. Turmhöhe, Stationen und Tempo bestimmt ${CFG.begleiter}.`
      : `${CFG.kind} sieht an jedem Alien – auf dem Weg, am Türschloss, am Aufzug – die Farbe oder Form und tippt unten den gleichen Knopf.`}</p>
    <h3>Was wird geübt?</h3>${seg('content', CONTENTS)}
    <h3>Knöpfe zur Auswahl</h3>${seg('count', [[2, '2'], [3, '3'], [4, '4']])}
    ${role === 'opi' ? `<h3>Ausgleich: Tempo von ${CFG.begleiter}s Figur</h3>${seg('opiSpeed', [[1, 'Normal'], [.75, 'Langsamer'], [.55, 'Ganz langsam']])}
      <p class="hint">Gewinnt ${CFG.begleiter} zu oft, eine Stufe langsamer stellen. Gilt sofort.</p>` : ''}
    ${role === 'thilo' ? '' : `<h3>Stationen im Turm</h3><div class="chips">${STATIONS.map(([id, name]) => `<button class="chip ${st.stations.includes(id) ? 'on' : ''}" data-k="stations" data-v="${id}">${ICON[id].replace('<svg', '<svg style="width:24px;height:24px"')}${name}</button>`).join('')}</div>
    <h3>Turmhöhe (Stationen)</h3>${seg('height', [[5, '5'], [8, '8'], [12, '12']])}`}
    <h3>Farben</h3><div class="chips">${COLORS.map(c => `<button class="chip ${st.colors.includes(c.id) ? 'on' : ''}" data-k="colors" data-v="${c.id}"><span class="cd" style="background:${c.hex}"></span>${c.name}</button>`).join('')}</div>
    <h3>Formen</h3><div class="chips">${SHAPES.map(s => `<button class="chip ${st.shapes.includes(s.id) ? 'on' : ''}" data-k="shapes" data-v="${s.id}">${svgShape(s.id, 'neutral')}${s.name}</button>`).join('')}</div>
    <h3>Schalter</h3>
    <label class="tog"><input type="checkbox" data-k="calm" ${st.calm ? 'checked' : ''}> Ruhiger Modus (langsamer, weniger Effekte)</label>
    <h3>Lernprotokoll</h3><div>${logTable()}</div>
    <p class="hint">Inhalt, Farben, Formen und Knöpfe gelten sofort. Stationen und Turmhöhe gelten ab dem nächsten ${online() ? 'Rennen' : 'Turm'}.</p>`;
  $('#sheetClose').onclick = () => $('#sheet').classList.remove('open');
  const on = (id, f) => { const e = $(id); if (e) e.onclick = f; };
  on('#shHelp', () => { showHelp(); $('#sheet').classList.remove('open'); });
  on('#shPause', () => { setPause(); buildSheet(); });
  on('#shNew', () => { $('#sheet').classList.remove('open'); if (role === 'opi') { if (!connected) { toast(`${CFG.kind} ist gerade nicht verbunden.`); return; } hostStartRace(); } else startTower(); });
  on('#shStart', toStart);
}
$('#sheet').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  const k = b.dataset.k, v = b.dataset.v;
  if (k === 'colors' || k === 'shapes' || k === 'stations') {
    const cur = settings[k].slice(), i = cur.indexOf(v), min = k === 'stations' ? 1 : 2;
    if (i >= 0) { if (cur.length <= min) { toast(k === 'stations' ? 'Mindestens eine Station muss bleiben.' : 'Mindestens zwei müssen ausgewählt bleiben.'); return; } cur.splice(i, 1); } else cur.push(v);
    updateSettings({ [k]: cur });
  } else if (k === 'count' || k === 'height' || k === 'opiSpeed') updateSettings({ [k]: +v });
  else updateSettings({ [k]: v });
});
$('#sheet').addEventListener('change', e => { const i = e.target.closest('input[data-k]'); if (i) updateSettings({ [i.dataset.k]: i.checked }); });
function openSheet() { buildSheet(); $('#sheet').classList.add('open'); }

// Menüknopf: eine Sekunde gedrückt halten, damit das Kind ihn nicht aus Versehen öffnet
const mb = $('#menuBtn'); let holdT = 0;
mb.innerHTML = ICON.ring + ICON.menu;
const holdEnd = () => { clearTimeout(holdT); mb.classList.remove('hold'); };
mb.addEventListener('pointerdown', e => { e.preventDefault(); mb.classList.add('hold'); holdT = setTimeout(() => { holdEnd(); openSheet(); }, 1000); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => mb.addEventListener(ev, holdEnd));
mb.addEventListener('contextmenu', e => e.preventDefault());

// ---------- Netzwerk (PeerJS): Verbindung und Sprachchat ----------
let peer = null, conn = null, mcall = null, localStream = null, silent = null, openTimer = 0, idTries = 0;
let connected = false, audioOn = false, micOn = false, lastRx = 0, rcTimer = null;
// Jedes Handy hat eine feste Kennung im Raum. Thilos Handy sucht Opis Handy, bis es online ist.
// Angenommen werden nur Verbindungen von genau dieser Gegenstelle.
const peerId = r => CFG.peerPrefix + CFG.raum + '-' + r;
const partnerId = () => peerId(role === 'opi' ? 'thilo' : 'opi');
function peerOpts() {
  const o = { debug: 0 }, q = new URLSearchParams(location.search), srv = q.get('server');
  if (srv) { const [h, pt] = srv.split(':'); o.host = h; o.port = +pt || 9000; o.path = '/'; o.secure = false; }   // nur zum Testen
  if (CFG.iceServers) o.config = { iceServers: CFG.iceServers };
  return o;
}
function send(m) { if (!conn || !conn.open) return; try { conn.send(m); } catch (e) {} }
async function getMic() {
  try { localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false }); micOn = true; }
  catch (e) { localStream = null; micOn = false; toast('Kein Mikrofon – du hörst trotzdem mit.'); }
  updateMic();
}
function outStream() {
  if (localStream) return localStream;
  if (!silent) { const ac = audioCtx(); silent = ac.createMediaStreamDestination().stream; }
  return silent;
}
function attachCall(c) {
  if (mcall && mcall !== c) { try { mcall.close(); } catch (e) {} }
  mcall = c;
  c.on('stream', st => {
    const a = $('#remote'); a.srcObject = st;
    a.play().then(() => { $('#soundFix').style.display = 'none'; }).catch(() => { $('#soundFix').style.display = 'grid'; });
    audioOn = true; updateStatus();
  });
  c.on('close', () => { if (mcall === c) { audioOn = false; updateStatus(); } });
  c.on('error', () => { if (mcall === c) { audioOn = false; updateStatus(); } });
}
function setupConn(c) {
  c.on('data', onData);
  c.on('close', () => { if (conn === c) { connected = false; audioOn = false; updateStatus(); if (role === 'thilo') scheduleReconnect(); } });
  c.on('error', () => {});
}
function noPeer() { updateStatus('Keine Internetverbindung?'); toast('Die Online-Verbindung konnte nicht geladen werden. Internet prüfen und Seite neu laden.', 5000); }
function openPeer() {   // eigene Kennung anmelden (beide Rollen)
  if (typeof Peer === 'undefined') { clearTimeout(openTimer); openTimer = setTimeout(() => { typeof Peer === 'undefined' ? noPeer() : openPeer(); }, 2500); return; }
  if (peer) { try { peer.destroy(); } catch (e) {} }
  const p = peer = new Peer(peerId(role), peerOpts());
  p.on('open', () => { idTries = 0; updateStatus(); if (role === 'thilo') connectHost(); });
  p.on('error', err => {
    if (peer !== p) return;
    if (err.type === 'unavailable-id') {   // z. B. nach dem Neuladen: der Server gibt die alte Anmeldung erst nach kurzer Zeit frei
      idTries++;
      updateStatus(idTries > 3 ? `Ist ${nameOf(role)} noch auf einem anderen Gerät offen?` : 'Melde an …');
      clearTimeout(openTimer); openTimer = setTimeout(openPeer, 4000); return;
    }
    if (err.type === 'peer-unavailable') { updateStatus(); scheduleReconnect(); return; }   // Gegenstelle noch nicht online
    if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) { updateStatus('Server nicht erreichbar – versuche erneut …'); scheduleReconnect(); }
  });
  p.on('connection', c => {
    if (role !== 'opi' || c.peer !== partnerId()) { try { c.close(); } catch (e) {} return; }   // fremde Verbindungen ablehnen
    if (conn && conn !== c) { try { conn.close(); } catch (e) {} }
    conn = c; setupConn(c);
    c.on('open', () => { connected = true; lastRx = Date.now(); updateStatus(); sfx('join'); sendHi(); });
  });
  p.on('call', c => { if (c.peer !== partnerId()) { try { c.close(); } catch (e) {} return; } c.answer(outStream()); attachCall(c); });
  p.on('disconnected', () => setTimeout(() => { if (peer === p && !p.destroyed && p.disconnected) p.reconnect(); }, 1500));
}
function connectHost() {   // nur Thilos Handy: Opis Handy suchen
  if (!peer || peer.destroyed || peer.disconnected || connected) return;
  const id = partnerId();
  const c = peer.connect(id, { reliable: true, serialization: 'json' });
  if (!c) { scheduleReconnect(); return; }
  if (conn && conn !== c) { try { conn.close(); } catch (e) {} }
  conn = c; setupConn(c);
  c.on('open', () => {
    if (conn !== c) return;
    connected = true; lastRx = Date.now(); updateStatus(); sfx('join');
    send({ t: 'hello', race: R ? R.id : null, fin: !!(R && R.done.thilo) });
    if (R) { R.sentF = -1; R.sentK = -1; }
    if (!mcall || !audioOn) { const mc = peer.call(id, outStream()); if (mc) attachCall(mc); }
  });
}
function scheduleReconnect() {   // Thilos Handy fragt alle 3 Sekunden, ob Opi schon da ist
  clearTimeout(rcTimer);
  if (role !== 'thilo') return;
  rcTimer = setTimeout(() => {
    if (connected || !peer || peer.destroyed) return;
    if (peer.disconnected) { peer.reconnect(); setTimeout(connectHost, 1200); } else connectHost();
  }, 3000);
}
setInterval(() => {   // Lebenszeichen; nach 12 s Stille gilt die Verbindung als weg
  if (!online() || !conn) return;
  send({ t: 'ping' });
  if (connected && Date.now() - lastRx > 12000) {
    connected = false; audioOn = false; updateStatus();
    if (role === 'thilo') { try { conn.close(); } catch (e) {} scheduleReconnect(); }
  }
}, 3000);
function updateMic() {
  const b = $('#micBtn');
  b.innerHTML = micOn ? ICON.mic : ICON.micOff; b.classList.toggle('off', !micOn);
  b.disabled = !localStream; b.style.display = online() ? 'grid' : 'none';
}
function updateStatus(extra) {
  let cls = '', msg = '';
  const other = role === 'opi' ? CFG.kind : CFG.begleiter;
  if (connected) { cls = 'ok'; msg = `${other} ist da` + (audioOn ? ' · Ton an' : ''); }
  else { cls = 'wait'; msg = `Warte auf ${other} …`; }
  if (extra) { msg = extra; cls = 'bad'; }
  $('#sdot').className = 'sdot ' + cls; $('#stxt').textContent = msg;
  updateUI();
}

// ---------- Wettrennen ----------
// Opis Handy öffnet den Raum, startet jedes Rennen und entscheidet, wer zuerst oben war.
// Beide Türme haben dieselbe Stationsfolge; die Aufgaben stellt jedes Handy nach seinen eigenen Einstellungen.
function sendHi() { send({ t: 'hi', race: R ? { id: R.id, winner: R.winner, done: R.done } : null, tally: TALLY }); }
function hostStartRace() {
  if (role !== 'opi' || !connected) return;
  const id = Math.random().toString(36).slice(2, 9), types = genTypes(settings);
  send({ t: 'race', id, types, tally: TALLY });
  beginRace(id, types);
}
function beginRace(id, types) {
  R = { id, types, winner: null, done: { thilo: false, opi: false }, oppF: 0, oppShown: 0, oppK: 0, oppMoveT: 0, sentF: -1, sentK: -1, told: false };
  $('#sheet').classList.remove('open'); show('#win', false);
  startTower(R);
}
function raceMeDone() {   // eigene Figur ist oben angekommen
  if (!R) return;
  if (role === 'opi') raceFinish('opi');
  else { R.done.thilo = true; send({ t: 'fin', id: R.id }); updateUI(); }
}
function raceFinish(who) {   // nur auf Opis Handy
  if (!R || R.done[who]) return;
  R.done[who] = true;
  if (!R.winner) { R.winner = who; TALLY[who]++; }
  send({ t: 'res', id: R.id, winner: R.winner, done: R.done, tally: TALLY });
  raceChanged();
}
function raceChanged() {
  const opp = role === 'opi' ? 'thilo' : 'opi';
  if (R && R.winner === opp && !R.done[role] && !R.told) { R.told = true; toast(`${nameOf(opp)} ist schon oben – klettere weiter!`, 3000); }
  updateUI();
}
function onData(m) {
  lastRx = Date.now();
  if (!m || typeof m !== 'object') return;
  if (m.t === 'pos') { if (R && m.id === R.id) { if (m.f > R.oppF + 1e-4) R.oppMoveT = now(); R.oppF = +m.f || 0; R.oppK = m.k | 0; if (S && S.phase === 'win') updateUI(); } return; }
  if (role === 'opi') {
    if (m.t === 'hello') {
      if (R && !R.done.thilo) { if (m.race === R.id && m.fin) raceFinish('thilo'); else if (m.race !== R.id) { R.done.thilo = true; raceChanged(); } }   // neu geladen: dieses Rennen zählt für Thilo nicht mehr
      sendHi();
    } else if (m.t === 'fin') { if (R && m.id === R.id) raceFinish('thilo'); }
  } else if (role === 'thilo') {
    if (m.t === 'race') { TALLY = m.tally || TALLY; beginRace(m.id, m.types); }
    else if (m.t === 'res' || m.t === 'hi') {
      if (m.tally) TALLY = m.tally;
      const r = m.t === 'res' ? m : m.race;
      if (R && r && r.id === R.id) { R.winner = r.winner; R.done = Object.assign({}, r.done, { thilo: R.done.thilo || r.done.thilo }); }
      raceChanged();
    }
  }
}
setInterval(() => {   // eigenen Fortschritt an den Gegner schicken
  if (!R || !S || !S.level || !connected) return;
  const f = clamp(V.p / S.level.pEnd, 0, 1), k = S.cleared.filter(Boolean).length;
  if (Math.abs(f - R.sentF) > .003 || k !== R.sentK) { R.sentF = f; R.sentK = k; send({ t: 'pos', id: R.id, f, k }); }
}, 250);

// ---------- Start ----------
// Beim ersten Mal wählt man, wer auf diesem Handy spielt. Das Handy merkt es sich.
const ROLE_KEY = 'raketenturm.rolle';
const savedRole = () => { try { const r = localStorage.getItem(ROLE_KEY); return r === 'opi' || r === 'thilo' ? r : null; } catch (e) { return null; } };
function startScreen() {
  show('#start', true);
  const b = $('#startBtns'), me = savedRole();
  if (!me) {
    $('#startTxt').textContent = 'Wettrennen auf den Turm. Wer spielt auf diesem Handy?';
    b.innerHTML = `<div class="who"><button class="big" data-r="thilo"><img src="${figURL('')}" alt="">${CFG.kind}</button><button class="big" data-r="opi"><img src="${figURL('opi')}" alt="">${CFG.begleiter}</button></div>
      <button class="link" id="goSolo">Allein üben</button>`;
    b.querySelectorAll('.who button').forEach(x => x.onclick = () => { try { localStorage.setItem(ROLE_KEY, x.dataset.r); } catch (e) {} beginOnline(x.dataset.r); });
  } else {
    $('#startTxt').textContent = `Hallo ${nameOf(me)}! Wer ist zuerst bei der Rakete?`;
    b.innerHTML = `<button class="big go" id="goOnline">Los geht's!</button>
      <button class="link" id="goSolo">Allein üben</button>
      <button class="link small" id="goSwitch">Auf diesem Handy spielt nicht ${nameOf(me)}?</button>`;
    $('#goOnline').onclick = () => beginOnline(me);
    $('#goSwitch').onclick = () => { try { localStorage.removeItem(ROLE_KEY); } catch (e) {} startScreen(); };
  }
  $('#goSolo').onclick = beginSolo;
}
async function beginOnline(r) {
  unlockAudio(true); role = r; settings = loadSettings(r);
  show('#start', false); updateMic(); updateStatus(); wakeLock();
  await getMic(); openPeer(); updateStatus();
}
function beginSolo() { unlockAudio(false); role = 'solo'; settings = loadSettings('solo'); show('#start', false); $('#sheet').classList.remove('open'); updateMic(); startTower(); }
$('#raceBtn').onclick = () => { audioCtx(); hostStartRace(); };
$('#lobbySettings').onclick = openSheet;
$('#waitSettings').onclick = openSheet;
$('#soundFix').innerHTML = ICON.speaker;
$('#soundFix').onclick = () => { audioCtx(); $('#remote').play().then(() => { $('#soundFix').style.display = 'none'; }).catch(() => {}); };
$('#micBtn').onclick = () => { if (!localStream) return; micOn = !micOn; localStream.getAudioTracks().forEach(tr => tr.enabled = micOn); updateMic(); };
$('#resumeBtn').onclick = () => setPause(false);
$('#card').onclick = () => { const c = $('#card'); c.classList.remove('attn'); void c.offsetWidth; c.classList.add('attn'); };
$('#againBtn').onclick = () => { audioCtx(); if (role === 'opi') hostStartRace(); else startTower(); };
startScreen(); updateMic(); updateUI();
window.__rt = { get S() { return S; }, get R() { return R; }, get role() { return role; }, get TALLY() { return TALLY; }, get connected() { return connected; },
  V, tap, updateSettings, lvl, setPause, hostStartRace };
</script>
</body>
